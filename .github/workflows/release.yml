name: release

on:
  push:
    tags: ["v*"]

# Verification reads source and artifacts only. Publication re-declares the
# single extra permission needed for npm OIDC trusted publishing.
permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # An exact patch keeps every release on a known runtime; a floating
          # line resolves from the runner toolcache and can lag a security
          # release. Move all three pins here with each Node 24 security fix.
          node-version: "24.22.1"
          cache: npm

      - run: npm ci --ignore-scripts

      # A mismatched tag must fail before an artifact can reach the publish job.
      - name: Tag must match package.json version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      # Build once so every verifier and npm receive identical package bytes.
      - name: Build publish artifact
        run: |
          mkdir -p artifact
          npm pack --pack-destination artifact

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: package
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run verify:ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: artifact

      - name: Verify packaged entry point
        shell: bash
        run: |
          set -- artifact/*.tgz
          test "$#" -eq 1 && test -f "$1"
          package="$PWD/$1"
          install_root="$RUNNER_TEMP/pi-stash-package"
          npm install --ignore-scripts --prefix "$install_root" "$package"
          node scripts/release/verify-package-entry.mjs "$install_root"

  publish:
    needs: [package, verify]
    runs-on: ubuntu-latest
    # The environment binds OIDC trusted publishing and the tag-only deployment
    # policy. It has no required reviewers: the admin-only tag ruleset makes the
    # signed tag push the release approval.
    environment: npm-release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Node 24 bundles npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: artifact

      # Publish only the digest-validated artifact exercised by verification.
      - name: Publish verified artifact
        run: |
          set -- artifact/*.tgz
          test "$#" -eq 1 && test -f "$1"
          package="$PWD/$1"
          npm publish "$package" --provenance --access public
