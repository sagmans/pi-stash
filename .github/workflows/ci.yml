name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the checked-out source.
permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    # One current-LTS Linux gate keeps hosted verification proportional while
    # local maintainer smoke remains the runtime behavior gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      # --ignore-scripts: nothing in this repo needs lifecycle scripts, and
      # skipping them shrinks the supply-chain surface of CI installs.
      - run: npm ci --ignore-scripts

      # The named full gate keeps maintainer guidance and CI aligned and fails
      # on moderate-or-higher dependency findings.
      - run: npm run verify:ci
